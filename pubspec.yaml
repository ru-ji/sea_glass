name: sea_glass
description: Sea glass for Flutter, frosted and softly tumbled, drawn with a real shader. Seeded outlines, frost, a glowing edge and transmitted light for Material 3 apps.
version: 0.2.1
homepage: https://github.com/ru-ji/sea_glass
repository: https://github.com/ru-ji/sea_glass
issue_tracker: https://github.com/ru-ji/sea_glass/issues

topics:
  - glass
  - shader
  - material-design
  - ui
  - widget

screenshots:
  - description: Sea glass promo, action pills, toolbars, a composer on a photo, shadow direction and the API
    path: doc/screenshots/promo.gif
  - description: The tumble slider reshaping glass buttons live
    path: doc/screenshots/tumble.gif
  - description: Quick Settings panel made of frosted and teal sea glass tiles
    path: doc/screenshots/quick_settings.png
  - description: A teal glass pill with a glowing lower edge
    path: doc/screenshots/pill.png
  - description: Glass pieces with shadows in several directions, tinted, faded and turned off
    path: doc/screenshots/shadow_directions.png

environment:
  sdk: ^3.6.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  shaders:
    - shaders/sea_glass.frag
