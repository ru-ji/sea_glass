name: sea_glass
description: Sea glass for Flutter, frosted and softly tumbled, drawn with a real shader. Seeded outlines, frost, a glowing edge and transmitted light for Material 3 apps.
version: 0.2.3
homepage: https://github.com/ru-ji/sea_glass
repository: https://github.com/ru-ji/sea_glass
issue_tracker: https://github.com/ru-ji/sea_glass/issues

topics:
  - glass
  - shader
  - material-design
  - ui
  - widget

screenshots:
  - description: Sea glass promo, a music player, a mail inbox, a little conversation and the API
    path: doc/screenshots/promo.gif
  - description: Sonder, a music player with a mint sea glass play button and control bar
    path: doc/screenshots/music.png
  - description: Post, a mail inbox with a sea glass Inbox and Archive switch and Compose button
    path: doc/screenshots/post.png
  - description: Nori, a conversation with lilac sea glass suggestion chips and a frosted input
    path: doc/screenshots/nori.png
  - description: A Compose button and three discs, clean at tumble 0 and worn at tumble 0.065
    path: doc/screenshots/tumble_levels.png
  - description: Glass pieces with shadows in several directions, tinted, faded and turned off
    path: doc/screenshots/shadow_directions.png

environment:
  sdk: ^3.6.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  shaders:
    - shaders/sea_glass.frag
