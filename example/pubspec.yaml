name: sea_glass_example
description: Sea Glass sample.
publish_to: none
version: 1.0.0
environment:
  sdk: ^3.6.0
  flutter: ">=3.41.0"
dependencies:
  flutter:
    sdk: flutter
  sea_glass:
    path: ../
flutter:
  uses-material-design: true
  fonts:
    - family: Google Sans
      fonts:
        - asset: assets/fonts/GoogleSans.ttf
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader.ttf
        - asset: assets/fonts/Newsreader-Italic.ttf
          style: italic
dev_dependencies:
  flutter_test:
    sdk: flutter
